name: Build & Deploy mercury-dasha to Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: mercury-dasha
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mercury-dasha/engine:${{ github.sha }}
  LATEST_TAG: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mercury-dasha/engine:latest

jobs:
  test-and-build:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: Authenticate to Google Cloud
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: env.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: env.GCP_PROJECT_ID != ''
        run: |
          docker build -t ${IMAGE_NAME} -t ${LATEST_TAG} .
          docker push ${IMAGE_NAME}
          docker push ${LATEST_TAG}

      - name: Deploy to Cloud Run
        if: env.GCP_PROJECT_ID != ''
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${IMAGE_NAME} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}
